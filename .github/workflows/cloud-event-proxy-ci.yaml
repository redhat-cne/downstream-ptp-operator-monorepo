name: "cloud-event-proxy: CI"
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'release-*'

jobs:
  golangci:
    name: Linting
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pkg/cloud-event-proxy
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v2
        with:
          go-version: '1.19'
      - name: tidy
        run: go mod tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3.2.0
        with:
          working-directory: pkg/cloud-event-proxy
          # Caching conflicts happen in GHA, so just disable for now
          skip-pkg-cache: true
          skip-build-cache: true
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v1.48.0
          args: --timeout 3m0s
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pkg/cloud-event-proxy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v2
        with:
          go-version: '1.19'
      - name: tidy
        run: go mod tidy
      - name: Run Test Scripts
        run: |
          make gha
