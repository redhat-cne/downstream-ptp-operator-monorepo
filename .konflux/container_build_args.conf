# We can consume this arg to check whether a build is in Konflux or not
KONFLUX=true
#

# Shared by operator, CEP, must-gather, bundle, FBC, and linuxptp-daemon.
# Do not set RUNTIME_IMAGE here: a Stream 9 pin would break UBI-based images.
# Pin the daemon runtime only on Dockerfile.linuxptp-daemon ARG RUNTIME_IMAGE
# and .konflux/rpms/linuxptp-daemon/rpms.in.yaml context.image.

# The builder image is used to compile golang code
BUILDER_IMAGE=brew.registry.redhat.io/rh-osbs/openshift-golang-builder:rhel_9_golang_1.25
#

# The opm image is used to serve the FBC (build-images FROM). Leave unset so
# Dockerfile.catalog ARG default (4.15) is used. Do not substitute
# PTP 5.x into this tag; ose-operator-registry-rhel9 only has OpenShift 4.y.
# OPM_IMAGE=registry.redhat.io/openshift4/ose-operator-registry-rhel9:v4.15
#

# The yq image is used at build time to manipulate yaml
YQ_IMAGE=quay.io/konflux-ci/yq:latest
#
