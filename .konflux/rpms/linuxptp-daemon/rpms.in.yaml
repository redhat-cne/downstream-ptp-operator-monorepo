packages:
  - pciutils
  - linuxptp
  - ethtool
  - hwdata
  - synce4l
  - iproute
  - procps-ng
  - chrony
  - name: gpsd-minimal
    arches:
      only:
        - x86_64
        - aarch64
  - name: gpsd-minimal-clients
    arches:
      only:
        - x86_64
        - aarch64
# Force matching libs into the hermetic repo. The UBI runtime drifts ahead of
# pinned transitive deps (e.g. acl needing libacl=EVR); without these reinstalls,
# hermetic yum fails with "nothing provides libacl…".
# rpm-lockfile-prototype omits RPMs already in context.image unless they are
# listed here. util-linux/openssl/systemd must stay locked to the image NEVRAs.
# Relock with scripts/relock-linuxptp-daemon-rpms.sh.
reinstallPackages:
  - systemd-libs
  - libacl
  - acl
  - util-linux
  - util-linux-core
  - libfdisk
  - openssl
  - systemd
# UBI9 runtime (FIPS OS). UBI CDN for base libs; CentOS Stream AppStream for
# linuxptp/chrony/synce4l/gpsd (not in the UBI public subset).
contentOrigin:
  repofiles:
    - ./ubi.repo
    - ./centos.repo
arches:
  - x86_64
  - aarch64
context:
  image: registry.access.redhat.com/ubi9/ubi:latest@sha256:206b65b8ee0f04b992818c9a51b29081b14974630d4850bc358097d0c44ea156
