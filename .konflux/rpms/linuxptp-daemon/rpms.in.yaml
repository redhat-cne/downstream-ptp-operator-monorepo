packages:
  - pciutils
  - linuxptp
  - ethtool
  - hwdata
  - synce4l
  - iproute
  - procps-ng
  - chrony
  - name: gpsd-minimal
    arches:
      only:
        - x86_64
        - aarch64
  - name: gpsd-minimal-clients
    arches:
      only:
        - x86_64
        - aarch64
# Force matching libs into the hermetic repo. CentOS Stream base images drift
# ahead of pinned transitive deps (e.g. acl needing libacl=EVR); without these
# reinstalls, hermetic yum fails with "nothing provides libacl…".
reinstallPackages:
  - systemd-libs
  - libacl
contentOrigin:
  repofiles:
    - ./centos.repo
arches:
  - x86_64
  - aarch64
context:
  image: quay.io/centos/centos:stream9
