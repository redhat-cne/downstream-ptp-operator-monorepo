packages:
  - pciutils
  - linuxptp
  - ethtool
  - hwdata
  - synce4l
  - iproute
  - procps-ng
  - chrony
  - name: gpsd-minimal
    arches:
      only:
        - x86_64
        - aarch64
  - name: gpsd-minimal-clients
    arches:
      only:
        - x86_64
        - aarch64
contentOrigin:
  contentSets:
    x86_64:
      - rhel-9-for-x86_64-appstream-rpms
      - rhel-9-for-x86_64-baseos-rpms
    aarch64:
      - rhel-9-for-aarch64-appstream-rpms
      - rhel-9-for-aarch64-baseos-rpms
arches:
  - x86_64
  - aarch64
