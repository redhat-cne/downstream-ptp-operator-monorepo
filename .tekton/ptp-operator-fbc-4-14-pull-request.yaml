---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/redhat-cne/downstream-ptp-operator-monorepo?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "release-4.14"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ptp-operator-fbc-4-14
    appstudio.openshift.io/component: ptp-operator-fbc-4-14
    pipelines.appstudio.openshift.io/type: build
  name: ptp-operator-fbc-4-14-on-pull-request
  namespace: experimental-ptp-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/experimental-ptp-tenant/ptp-operator-fbc-4-14:on-pr-{{revision}}
    - name: image-expires-after
      value: 5d
    - name: build-platforms
      value:
        - linux/x86_64
        - linux/arm64
    - name: dockerfile
      value: .konflux/Dockerfile.catalog
    - name: build-args-file
      value: .konflux/container_build_args.conf
    - name: additional-tags
      value: ["on-pr-latest"]
    - name: build-source-image
      value: "true"
    - name: hermetic
      value: "true"
    # bundle-image-override and run-opm-pre-actions-hermetic stay at pipeline
    # defaults (empty / true). Catalog uses committed bundle.builds.in.yaml.
  pipelineRef:
    name: fbc-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-ptp-operator-fbc-4-14
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
