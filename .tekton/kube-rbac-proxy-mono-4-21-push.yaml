---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/nudge_renovate_config_map: namespace-wide-nudging-renovate-config
    build.appstudio.openshift.io/repo: https://github.com/redhat-cne/downstream-ptp-operator-monorepo?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" &&
      target_branch == "release-4.21" &&
      (
        '.konflux/container_build_args.conf'.pathChanged() ||
        '.tekton/build-pipeline.yaml'.pathChanged() ||
        '.tekton/kube-rbac-proxy-mono-4-21-push.yaml'.pathChanged() ||
        '.konflux/Dockerfile.kube-rbac-proxy'.pathChanged() ||
        'pkg/kube-rbac-proxy/***'.pathChanged() ||
        'telco5g-konflux'.pathChanged() ||
        'telco5g-konflux/***'.pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ptp-operator-mono-4-21
    appstudio.openshift.io/component: kube-rbac-proxy-mono-4-21
    pipelines.appstudio.openshift.io/type: build
  name: kube-rbac-proxy-mono-4-21-on-push
  namespace: experimental-ptp-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/experimental-ptp-tenant/kube-rbac-proxy-mono-4-21:{{revision}}
    - name: build-platforms
      value:
        - linux/x86_64
        - linux/arm64
    - name: path-context
      value: pkg/kube-rbac-proxy
    - name: dockerfile
      value: .konflux/Dockerfile.kube-rbac-proxy
    - name: build-args-file
      value: .konflux/container_build_args.conf
    - name: hermetic
      value: "true"
    - name: dev-package-managers
      value: "true"
    - name: prefetch-input
      value: '[{"type": "gomod", "path": "pkg/kube-rbac-proxy"}]'
    - name: build-source-image
      value: "true"
    - name: skip-sast-coverity
      value: "true"
    - name: additional-tags
      value: ["latest"]
    - name: additional-labels
      value:
        - name=openshift4/ose-kube-rbac-proxy-rhel9
  pipelineRef:
    name: build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-kube-rbac-proxy-mono-4-21
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
