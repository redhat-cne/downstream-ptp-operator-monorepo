---
# We use this IDMS in the Conforma tests to check for fips compliance.
# https://github.com/konflux-ci/build-definitions/tree/main/task/fbc-fips-check-oci-ta/0.1
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: ptp-operator-digest-mirror-set
spec:
  imageDigestMirrors:
    - mirrors:
        - quay.io/redhat-user-workloads/experimental-ptp-tenant/ptp-operator-mono-4-13
      source: registry.redhat.io/experimental-ptp/ptp-operator-mono-rhel9-operator
    - mirrors:
        - quay.io/redhat-user-workloads/experimental-ptp-tenant/ptp-operator-bundle-mono-4-13
      source: registry.redhat.io/experimental-ptp/ptp-operator-bundle-mono-operator-bundle
    - mirrors:
        - quay.io/redhat-user-workloads/experimental-ptp-tenant/linuxptp-daemon-mono-4-13
      source: registry.redhat.io/experimental-ptp/linuxptp-daemon-mono-rhel9
    - mirrors:
        - quay.io/redhat-user-workloads/experimental-ptp-tenant/cloud-event-proxy-mono-4-13
      source: registry.redhat.io/experimental-ptp/cloud-event-proxy-mono-rhel9
    - mirrors:
        - quay.io/redhat-user-workloads/experimental-ptp-tenant/kube-rbac-proxy-mono-4-13
      source: registry.redhat.io/openshift4/ose-kube-rbac-proxy-rhel9
    - mirrors:
        - quay.io/redhat-user-workloads/experimental-ptp-tenant/ptp-must-gather-mono-4-13
      source: registry.redhat.io/experimental-ptp/ptp-must-gather-mono-rhel9
