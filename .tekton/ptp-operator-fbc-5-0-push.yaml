---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/redhat-cne/downstream-ptp-operator-monorepo?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" &&
      target_branch == "release-5.0" &&
      !event_title.contains("[BRANCH-CUT]") &&
      (
        '.konflux/catalog/***'.pathChanged() ||
        '.konflux/container_build_args.conf'.pathChanged() ||
        '.konflux/Dockerfile.catalog'.pathChanged() ||
        '.tekton/fbc-pipeline.yaml'.pathChanged() ||
        '.tekton/images-mirror-set.yaml'.pathChanged() ||
        '.tekton/ptp-operator-fbc-5-0-push.yaml'.pathChanged() ||
        'telco5g-konflux'.pathChanged() ||
        'telco5g-konflux/***'.pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ptp-operator-fbc-5-0
    appstudio.openshift.io/component: ptp-operator-fbc-5-0
    pipelines.appstudio.openshift.io/type: build
  name: ptp-operator-fbc-5-0-on-push
  namespace: experimental-ptp-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/experimental-ptp-tenant/ptp-operator-fbc-5-0:{{revision}}
    - name: build-platforms
      value:
        - linux/x86_64
        - linux/arm64
    - name: dockerfile
      value: .konflux/Dockerfile.catalog
    - name: build-args-file
      value: .konflux/container_build_args.conf
    - name: additional-tags
      value: ["latest"]
    - name: build-source-image
      value: "true"
    - name: hermetic
      value: "true"
    # run-opm-pre-actions-hermetic defaults to true on the fbc-pipeline.
    # Leave it unset here so Conforma hermetic_task.hermetic passes on push.
    # PR PipelineRuns also leave it unset; catalog uses committed bundle.builds.in.yaml.
  pipelineRef:
    name: fbc-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-ptp-operator-fbc-5-0
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
